name: Weekly skills discovery
on:
  schedule:
    - cron: '17 1 * * 1' # Monday 09:17 Asia/Hong_Kong
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-skills-report
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s tests -v
      - name: Collect public evidence
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 report.py
      - name: Preserve evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skills-discovery-evidence
          path: reports/
      - name: Create report PR
        if: steps.collect.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          branch="reports/weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: weekly discovery evidence'
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title 'Weekly AI skills discovery report' --body-file docs/REPORT_PR.md
      - if: steps.collect.outcome != 'success'
        run: exit 1
